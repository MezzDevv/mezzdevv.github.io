name: Update Roblox stats

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    paths:
      - data/games.json
      - data/counted-games.json
      - data/site.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-roblox.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox.json
          git diff --cached --quiet || git commit -m "Update Roblox stats"
          git push
